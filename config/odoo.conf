[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
admin_passwd = admin
; Odoo 20 defaults to loopback, which Docker's port mapping can't reach.
; docker-compose.yml still publishes the port on the host's localhost only.
http_interface = 0.0.0.0
; Re-read XML views from disk without upgrading the module
dev_mode = xml
