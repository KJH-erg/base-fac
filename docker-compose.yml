# Local development only: credentials below are throwaway and ports bind to localhost.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:20.0
    depends_on: [db]
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # Odoo's container user would leave __pycache__ files in addons/ that you can't delete on Linux.
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # :z lets containers read these on SELinux hosts (Fedora, RHEL); ignored elsewhere.
      - ./addons:/mnt/extra-addons:z
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro,z
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
